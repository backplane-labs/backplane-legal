# Registration that requires the installation's legal documents.
#
# Put this file in BACKPLANE_WIRING_DIR (with backplane-kratos and legal
# registered). The registration form sends the subject's choices as
# transient_payload.legal_acceptances: [{document, version, lang}] — the
# versions legal.ListDocuments / legal.Pending (audience registration) or the
# public API showed.
#
# Two points of the flow, because the identity has no id until Kratos
# stores it:
#   1. kratos.AfterRegistration, before the store, Kratos waits:
#      legal.Check — do the choices cover every required current document?
#      It writes nothing; when they do not, the flow is denied with a
#      message on the form and no identity is created.
#   2. kratos.AfterRegistrationStored, after the store, Kratos waits:
#      legal.Accept records the evidence with the identity's final id as
#      the subject.
# If legal fails at 1, the registration stops. If it fails at 2, the flow
# fails but the identity stays stored without the evidence; legal.Pending
# at sign-in then shows it the required documents again (channel
# reaccept), so no session goes on without them.
#
# Keep both hooks out of backplane-kratos's fail_open setting: failing
# open at 1 would let a registration through without the check.
bindings:
  - hook: kratos.AfterRegistration
    steps:
      checked:
        activity: legal.Check
        input:
          audience: "'registration'"
          items: "has(req.transient_payload) && has(req.transient_payload.legal_acceptances) ? req.transient_payload.legal_acceptances : []"
    result:
      deny: "checked.ok ? dyn(null) : dyn({'messages': [{'id': 4000901, 'text': 'Accept the required documents to register.'}]})"
  - hook: kratos.AfterRegistrationStored
    steps:
      accepted:
        activity: legal.Accept
        when: "has(req.transient_payload) && has(req.transient_payload.legal_acceptances) && size(req.transient_payload.legal_acceptances) > 0"
        input:
          subject: req.identity.id
          items: req.transient_payload.legal_acceptances
          context:
            channel: "'registration'"
            flow_id: req.flow_id
            method: req.method
            user_agent: "has(req.request_headers) && 'User-Agent' in req.request_headers ? req.request_headers['User-Agent'] : ''"
            # The right-most X-Forwarded-For hop: the one your edge proxy
            # appended. The hops left of it are the client's to write.
            # Behind more proxies of your own, count that many from the right.
            ip: "has(req.request_headers) && 'X-Forwarded-For' in req.request_headers ? req.request_headers['X-Forwarded-For'].split(',')[size(req.request_headers['X-Forwarded-For'].split(',')) - 1].trim() : ''"
