name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal
        ports: ['5457:5432']
        options: >-
          --health-cmd "pg_isready -U legal -d legal" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GOWORK: 'off'
      LEGAL_TEST_PG: postgres://legal:legal@localhost:5457/legal?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@backplane-labs'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: make configure configure-web configure-events
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make lint
      - run: make db && git diff --exit-code -- internal/store/db internal/store/migrations
      - run: make gen && git diff --exit-code -- proto web/src/gen events/src
      - run: cd web && env -u HTTPS_PROXY -u HTTP_PROXY -u https_proxy -u http_proxy yarn -s typecheck
      - run: make web events build
      - run: go vet ./...
      - run: go test -race -count=1 ./...
