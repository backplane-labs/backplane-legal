syntax = "proto3";
package legal.events.v1;
option go_package = "github.com/backplane-labs/backplane-legal/proto/legal/events/v1;legaleventsv1";

// Published announces an immutable publication, possibly effective in the future.
message Published {
  string document = 1;
  int64 version = 2;
  // RFC 3339 timestamp.
  string effective_at = 3;
  bool required = 4;
  string audience = 5;
}
// Accepted announces one journal append. seq is the deduplication key.
message Accepted {
  string subject = 1;
  string document = 2;
  int64 version = 3;
  string lang = 4;
  int64 seq = 5;
}
// Withdrawn announces an optional consent withdrawal.
message Withdrawn {
  string subject = 1;
  string document = 2;
  int64 version = 3;
  string lang = 4;
  int64 seq = 5;
}
